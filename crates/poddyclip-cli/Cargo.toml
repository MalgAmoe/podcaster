[package]
name = "poddyclip-cli"
version.workspace = true
edition.workspace = true
description = "CLI for podcast audio enhancement"

[[bin]]
name = "poddyclip"
path = "src/main.rs"

[features]
default = ["mossformer2"]
mossformer2 = ["poddyclip/mossformer2"]

[dependencies]
poddyclip = { path = "../poddyclip" }
anyhow = "1.0"
symphonia = { version = "0.5.5", features = ["mp3", "wav", "pcm", "flac", "aac", "isomp4"] }
hound = "3.5"
clap = { version = "4.5", features = ["derive"] }
