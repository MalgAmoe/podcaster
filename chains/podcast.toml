name = "Podcast"
description = "Balanced processing for conversational podcasts"

denoiser = 3
expander = 2           # Light - preserve natural room
compressor = { type = "peak", preset = 3 }
fixeq = true
deesser = true
saturation = 2         # Light warmth
buttercomp = 3
enhanceeq = 3
tape = 2
output = -16           # Standard podcast LUFS
