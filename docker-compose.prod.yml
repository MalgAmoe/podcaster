services:
  phoenix:
    image: malgamoe/stuff:phoenix
    build:
      context: ./backend
      network: host
    env_file: .env.prod
    environment:
      - PHX_SERVER=true
      - PORT=4000
      - PODDYCLIP_API_URL=http://rust-api:3000
      - WEBHOOK_BASE_URL=http://phoenix:4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - rust-api
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/users/log-in"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  rust-api:
    image: malgamoe/stuff:api
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    env_file: .env.prod
    environment:
      - PORT=3000
      - RUST_LOG=info
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
