services:
  phoenix:
    image: malgamoe/stuff:phoenix
    build:
      context: ./backend
      network: host
    env_file: .env.prod
    environment:
      - PHX_SERVER=true
      - PORT=4000
      - PODDYCLIP_API_URL=http://rust-api:3000
      - WEBHOOK_BASE_URL=http://phoenix:4000
    ports:
      - target: 4000
        published: 4000
        mode: host
    depends_on:
      - rust-api
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/users/log-in"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0

  rust-api:
    image: malgamoe/stuff:api
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    env_file: .env.prod
    environment:
      - PORT=3000
      - RUST_LOG=info
    ports:
      - target: 3000
        published: 3000
        mode: host
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
