services:
  phoenix:
    image: malgamoe/stuff:phoenix
    build:
      context: ./backend
      network: host
    env_file: .env.prod
    environment:
      - PHX_SERVER=true
      - PORT=4000
      - PODDYCLIP_API_URL=http://rust-api:3000
      - WEBHOOK_BASE_URL=http://phoenix:4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - rust-api
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/4000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  rust-api:
    image: malgamoe/stuff:api
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    env_file: .env.prod
    environment:
      - PORT=3000
      - RUST_LOG=info
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
