[package]
name = "poddyclip"
version = "0.1.0"
edition = "2021"
authors = ["Poddyclip Team"]
license = "MIT"
description = "Spectral Subtraction Noise Reduction Plugin"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Core dependency (used by both CLI and plugin)
rustfft = "6.2"

# Plugin-only dependencies (optional)
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"], optional = true }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
egui_plot = { version = "0.31", optional = true }
paste = { version = "1.0", optional = true }

# CLI-only dependencies (optional)
anyhow = { version = "1.0.100", optional = true }
symphonia = { version = "0.5.5", features = ["mp3", "wav", "pcm"], optional = true }
hound = { version = "3.5", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[[bin]]
name = "poddyclip-cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["plugin"]
plugin = ["nih_plug", "nih_plug_egui", "egui_plot", "paste"]
cli = ["anyhow", "symphonia", "hound", "clap"]

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
