apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 600  # 10 min for long jobs
      containers:
      - name: api
        image: malgamoe/stuff:api
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PORT
          value: "3000"
        - name: RUST_LOG
          value: "info"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Wait for active jobs to finish
                while true; do
                  JOBS=$(curl -sf http://localhost:3000/health | grep -o '"active_jobs":[0-9]*' | cut -d: -f2)
                  if [ "$JOBS" = "0" ] || [ -z "$JOBS" ]; then
                    break
                  fi
                  echo "Waiting for $JOBS jobs to finish..."
                  sleep 5
                done
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
