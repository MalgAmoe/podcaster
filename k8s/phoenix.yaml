apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: phoenix
        image: malgamoe/stuff:phoenix
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PHX_SERVER
          value: "true"
        - name: PORT
          value: "4000"
        - name: PODDYCLIP_API_URL
          value: "http://api:3000"
        - name: WEBHOOK_BASE_URL
          value: "http://phoenix:4000"
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
spec:
  selector:
    app: phoenix
  ports:
  - port: 4000
    targetPort: 4000
---
# Global rate limit - generous baseline to stop abuse
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: global-rate-limit
spec:
  rateLimit:
    average: 50
    burst: 100
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: phoenix
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: global-rate-limit
      services:
        - name: phoenix
          port: 4000
