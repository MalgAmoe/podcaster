apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: phoenix
        image: malgamoe/stuff:phoenix
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PHX_SERVER
          value: "true"
        - name: PORT
          value: "4000"
        - name: PODDYCLIP_API_URL
          value: "http://api:3000"
        - name: WEBHOOK_BASE_URL
          value: "http://phoenix:4000"
        readinessProbe:
          httpGet:
            path: /users/log-in
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /users/log-in
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
spec:
  selector:
    app: phoenix
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phoenix
            port:
              number: 4000
