apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
      - name: openobserve
        image: public.ecr.aws/zinclabs/openobserve:latest
        ports:
        - containerPort: 5080
        env:
        - name: ZO_ROOT_USER_EMAIL
          valueFrom:
            secretKeyRef:
              name: openobserve-secrets
              key: ZO_ROOT_USER_EMAIL
        - name: ZO_ROOT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openobserve-secrets
              key: ZO_ROOT_USER_PASSWORD
        # S3 storage (using Cloudflare R2)
        - name: ZO_S3_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: openobserve-secrets
              key: ZO_S3_SERVER_URL
        - name: ZO_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: openobserve-secrets
              key: ZO_S3_ACCESS_KEY
        - name: ZO_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: openobserve-secrets
              key: ZO_S3_SECRET_KEY
        - name: ZO_S3_BUCKET_NAME
          value: "openobserve-data"
        - name: ZO_S3_REGION_NAME
          value: "auto"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5080
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
spec:
  selector:
    app: openobserve
  ports:
  - port: 5080
    targetPort: 5080
  type: ClusterIP  # Internal only - no ingress
