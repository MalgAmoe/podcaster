[alias]
xtask = "run --package xtask --release --"
build-cli = "build --release -p poddyclip-cli"
build-plugin = "xtask bundle poddyclip-plugin --release"
run-cli = "run --release -p poddyclip-cli --"

# SIMD optimization: enable AVX2/FMA for modern CPUs (2015+)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
