# fly.toml app configuration file generated for munchycow on 2026-04-24T13:12:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'munchycow'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    ADMIN_ENABLED = 'false'

[deploy]
  release_command = '/app/bin/poddyclip_backend eval "PoddyclipBackend.Release.migrate"'

[env]
  PHX_HOST = 'poddyclip-backend.fly.dev'
  PHX_SERVER = 'true'
  PORT = '4000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
